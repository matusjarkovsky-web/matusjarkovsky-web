name: Nahrat fotku Matusa (vlastny subor)

# Zoberie fotografiu, ktoru Matúš nahral, optimalizuje ju na 800x800 WebP
# a uloží ako images/matus-jarkovsky.webp. Beží raz, potom sa dá zmazať.
on:
  push:
    paths:
      - '.github/workflows/upload-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stiahni prilozenu fotku
        run: |
          curl -fsSL --max-time 90 -A 'Mozilla/5.0' \
            -o /tmp/source.webp \
            'https://cdn-chatly-docs.vyro.ai/chatly/ultra-agent/uploads/3c022885-cc32-4117-a5b3-f841a5422e48/81b2de1a-5da3-465a-9b9f-8fed9c3afdd7.webp'
          ls -l /tmp/source.webp
          test "$(head -c 4 /tmp/source.webp)" = "RIFF"

      - name: Optimalizuj na 800x800
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/source.webp').convert('RGB')
          print('zdroj:', im.size)
          im = im.resize((800, 800), Image.LANCZOS)
          im.save('images/matus-jarkovsky.webp', quality=80, method=6)
          print('hotovo: 800x800')
          PY
          ls -l images/

      - name: Commitni
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/matus-jarkovsky.webp
          if git diff --cached --quiet; then
            echo 'Bez zmeny.'
          else
            git commit -m 'Fotka Matusa: vlastny subor, optimalizovana na 800x800'
            git push
          fi
